blueprint:
  name: Sync devices with Schedule
  description: >
    Keeps N devices in sync with a Schedule entity. When the schedule
    turns ON, turn_on is called on the devices; when it turns OFF,
    turn_off is called. Optionally inverts the logic (schedule ON =
    devices OFF).

    With "Sync on startup" enabled, the devices are forced to match the
    schedule after a restart, so a device turned on manually will be turned
    off if the schedule is OFF at that moment.
  domain: automation
  author: 0x3333
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/0x3333/ha-blueprint-schedule-sync/blob/main/schedule_sync.yaml
  input:
    schedule:
      name: Schedule
      description: Schedule entity that controls the devices.
      selector:
        entity:
          domain: schedule
    targets:
      name: Devices
      description: >
        Entities, devices or areas that support turn_on / turn_off
        (lights, switches, fans, media players, input_boolean, etc.).
      selector:
        target: {}
    invert:
      name: Invert
      description: >
        If enabled, schedule ON turns the devices OFF and schedule OFF
        turns them ON.
      default: false
      selector:
        boolean: {}
    sync_on_start:
      name: Sync on startup
      description: >
        Also sync when Home Assistant starts (useful to restore the
        correct state after a restart).
      default: true
      selector:
        boolean: {}
    startup_delay:
      name: Startup delay
      description: >
        Time to wait after Home Assistant starts before syncing, so that
        devices (e.g. ESPHome) have time to connect.
      default:
        seconds: 30
      selector:
        duration: {}

mode: queued
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input schedule
    to:
      - "on"
      - "off"
    id: schedule
  - trigger: homeassistant
    event: start
    id: start

variables:
  schedule_entity: !input schedule
  invert: !input invert
  sync_on_start: !input sync_on_start
  schedule_state: "{{ states(schedule_entity) }}"
  desired_on: "{{ (schedule_state == 'on') != invert }}"

conditions:
  - condition: template
    value_template: >
      {{ trigger.id == 'schedule' or sync_on_start }}
  - condition: template
    value_template: "{{ schedule_state in ['on', 'off'] }}"

actions:
  - if:
      - condition: trigger
        id: start
    then:
      - delay: !input startup_delay
  - if:
      - condition: template
        value_template: "{{ desired_on }}"
    then:
      - action: homeassistant.turn_on
        continue_on_error: true
        target: !input targets
    else:
      - action: homeassistant.turn_off
        continue_on_error: true
        target: !input targets
